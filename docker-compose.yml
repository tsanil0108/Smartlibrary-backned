services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smart_library
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_library"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/smart_library
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-to-a-long-random-secret-min-32-chars
      CORS_ORIGINS: http://localhost:5173
    ports: ["8080:8080"]

volumes:
  pgdata:
